<div class="popup-overlay" *ngIf="visible">
  <div class="popup-box">
    <h2 class="popup-title">
      {{ title }}
    </h2>

    <p class="popup-message">
      {{ message }}
    </p>

    <div class="popup-actions">
      <button
        class="popup-button cancel"
        (click)="onCancel()"
      >
        {{ cancelButtonText }}
      </button>

      <button
        class="popup-button confirm"
        [ngClass]="confirmButtonColor"
        (click)="onConfirm()"
      >
        {{ confirmButtonText }}
      </button>
    </div>
  </div>
</div>
