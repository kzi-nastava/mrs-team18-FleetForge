<ng-container *ngIf="rideData && cardInfo; else noCurrentRide">
  <app-current-ride
    [rideData]="rideData"
    [cardInfo]="cardInfo"
    [actionButtons]="activeActionButtons"
    [showRating]="true"
    [subtitle]="getRideSubtitle()"
    (actionButtonClicked)="onActionButton($event)">
  </app-current-ride>

  <!-- Wrong Way Report Modal -->
  <div class="modal-overlay" *ngIf="showWrongWayModal" (click)="onCloseWrongWayModal()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h2 class="modal-title">Report Issue</h2>
        <button class="modal-close-btn" (click)="onCloseWrongWayModal()">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      
      <div class="modal-body">
        <label class="form-label">Describe the driver inconsistency:</label>
        <textarea 
          class="form-textarea"
          [(ngModel)]="wrongWayReport"
          placeholder="Please provide details about the issue (e.g., wrong route, unsafe driving, etc.)"
          rows="6"
          maxlength="500"
        ></textarea>
        <div class="char-counter">{{ wrongWayReport.length }}/500</div>
      </div>
      
      <div class="modal-footer">
        <button class="btn-secondary" (click)="onCloseWrongWayModal()">Close</button>
        <button class="btn-primary" (click)="onSubmitWrongWayReport()">Submit Report</button>
      </div>
    </div>
  </div>

  <app-ride-rating-modal
    [isOpen]="showRatingModal && isCompleted()"
    [pickupAddress]="rideData.route.startAddress || ''"
    [dropoffAddress]="rideData.route.endAddress || ''"
    [formData]="ratingForm"
    [isLoading]="isRatingLoading"
    [showFinishedMessage]="true"
    (closed)="closeRatingModal()"
    (submitted)="onRatingSubmitted($event)"
    (notNow)="onRatingNotNow()"
  ></app-ride-rating-modal>
</ng-container>

<ng-template #noCurrentRide>
  <div class="empty-state">
    <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99z"/>
    </svg>
    <h2>No Active Ride</h2>
    <p>You currently don't have an active ride.</p>
  </div>
</ng-template>

<app-confirmation-popup
  [visible]="showSosConfirmPopup"
  title="Emergency SOS"
  message="Are you sure you want to activate SOS? Emergency services and support will be notified."
  confirmButtonText="Activate SOS"
  cancelButtonText="Cancel"
  confirmButtonColor="red"
  (confirmed)="confirmSos()"
  (cancelled)="closeSosPopup()">
</app-confirmation-popup>

<app-notification-popup
  [visible]="notificationVisible"
  [title]="notificationTitle"
  [message]="notificationMessage"
  [success]="notificationSuccess"
  okButtonText="OK"
  (closed)="onNotificationClosed()">
</app-notification-popup>
