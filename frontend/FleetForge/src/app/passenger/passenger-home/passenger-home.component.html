<div class="home-container">
  <div class="hero-section">
    <div class="hero-content">
      <h1>Book Rides<br>Anywhere</h1>
      <div class="hero-buttons">
        <button class="btn btn-primary" type="button" (click)="scrollToBookRide()">Book Now</button>
        <button class="btn btn-secondary">Call Operator</button>
      </div>
    </div>
    <div class="hero-image">
      <img src="home-screen.png" alt="Taxi and passengers" />
    </div>
  </div>

  <div class="find-vehicle-section">
    <div class="find-vehicle-container">
      
      <form class="form-section" [formGroup]="rideForm" (ngSubmit)="onSubmit()">
        <h2 id="bookRide">Find Your Vehicle</h2>

        <div class="form-group">
          <label for="pickup">Pick Up Address</label>
          <div class="input-wrapper">
            <input 
              type="text" 
              id="pickup" 
              formControlName="pickup" 
              placeholder="Pick Destination" 
              (change)="onWaypointChange($event, -2)" 
              autocomplete="off"
            />
          </div>
        </div>

        <div class="form-group" formArrayName="waypoint">
          <div *ngFor="let point of waypointArray.controls; let i = index" class="waypoint-item">
            <label for="waypoint{{i}}">Waypoint {{ i + 1 }}</label>
            <div class="input-wrapper has-remove-btn">
              <input 
                [formControlName]="i" 
                type="text" 
                id="waypoint{{i}}"
                placeholder="Enter waypoint"
                (change)="onWaypointChange($event, i)"
                autocomplete="off"
              >
              <button 
                type="button" 
                class="btn-remove-waypoint" 
                (click)="removeWaypoint(i)"
                aria-label="Remove waypoint">
                ✕
              </button>
            </div>
          </div>

          <button class="btn-add-waypoint" type="button" (click)="addWaypointInput()">
            + Add New Waypoint
          </button>
        </div>

        <div class="form-group">
          <label for="dropoff">Drop Off Address</label>
          <div class="input-wrapper">
            <input 
              type="text" 
              id="dropoff" 
              formControlName="dropoff" 
              placeholder="Pick Destination" 
              (change)="onWaypointChange($event, -1)" 
              autocomplete="off"
            />
          </div>
        </div>

        <hr> <div class="form-group">
          <label for="passengers">Total Passengers</label>
          <div class="input-wrapper">
            <input type="number" id="passengers" formControlName="passengers" placeholder="Number of Passengers" />
          </div>
        </div>

        <div class="form-group" formArrayName="passenger">
          <div *ngFor="let passenger of passengerArray.controls; let j = index">
            <label for="passenger{{j}}">Passenger {{ j + 1 }} Name</label>
            <div class="input-wrapper has-remove-btn">
              <input 
                [formControlName]="j"
                type="text" 
                id="passenger{{j}}"
                placeholder="Enter passenger name"
              >
              <button 
                type="button" 
                class="btn-remove-waypoint" 
                (click)="removePassenger(j)">
                ✕
              </button>
            </div>
          </div>

          <button class="btn-add-waypoint" type="button" (click)="addPassengerInput()">
            + Add New Passenger
          </button>
        </div>

        <div class="form-group">
          <label for="datetime">Date & Time</label>
          <div class="datetimeNow">
            <input type="datetime-local" id="datetime" formControlName="datetime" [min]="minDateTime" />
            <div class="now-toggle">
              <input type="checkbox" id="now" formControlName="now" (change)="onNowToggle()" />
              <label for="now">Now</label>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="additionalCriteriaLabel">Vehicle Options</label>
          <div class="additionalCriteria">
            <select id="type" formControlName="type" required>
              <option value="" disabled selected>Select vehicle type</option>
              <option value="STANDARD">Standard</option>
              <option value="LUXURY">Luxury</option>
              <option value="VAN">Van</option>
            </select>
            
            <div class="checkbox-group">
              <div class="now-toggle">
                <input type="checkbox" id="babySeat" formControlName="babySeat" />
                <label for="babySeat">Baby seat</label>
              </div>
              <div class="now-toggle">
                <input type="checkbox" id="petFriendly" formControlName="petFriendly" />
                <label for="petFriendly">Pet friendly</label>
              </div>
            </div>
          </div>
        </div>

        <button class="btn btn-order" type="submit" [disabled]="rideService.isRideActive">Order Ride</button>

      </form>

      <div class="map-section">
        <app-map [vehicles]="vehicles" (mapClick)="handleMapClick($event)" (routeSummary)="onRouteSummary($event)"></app-map>
      </div>

    </div>
  </div>
</div>
