<ng-container *ngIf="rideData && cardInfo; else noCurrentRide">
  <app-current-ride
    [rideData]="rideData"
    [cardInfo]="cardInfo"
    [actionButtons]="actionButtons"
    [showRating]="false"
    (routeCoordinatesReceived)="onRouteCoordinatesReceived($event)"
    (actionButtonClicked)="onActionButton($event)">
  </app-current-ride>
</ng-container>
<ng-template #noCurrentRide>
  <div class="empty-state">
    <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99z"/>
    </svg>
    <h2>No Active Ride</h2>
    <p>You currently don't have an active ride.</p>
  </div>
</ng-template>
<app-confirmation-popup
  [visible]="showCancelConfirm"
  title="Cancel Ride"
  message="Are you sure you want to cancel this ride? This action cannot be undone."
  cancelButtonText="Abort"
  confirmButtonText="Cancel"
  confirmButtonColor="red"
  (confirmed)="confirmCancelRide()"
  (cancelled)="closeCancelConfirmation()"
></app-confirmation-popup>
<div class="popup-overlay" *ngIf="showCancelReasonPopup">
  <div class="popup-box">
    <h2 class="popup-title">Cancel Ride</h2>

    <p class="popup-message">
      Please provide a reason for cancelling this ride.
    </p>

    <textarea
      class="popup-textarea"
      [(ngModel)]="cancelReason"
      rows="4"
      placeholder="Enter cancellation reason..."
    ></textarea>

    <div class="popup-actions">
      <button class="popup-button cancel" (click)="closeCancelReasonPopup()">
        Abort
      </button>

      <button
        class="popup-button confirm red"
        [disabled]="!cancelReason.trim()"
        (click)="submitCancelReason()"
      >
        Cancel
      </button>
    </div>
  </div>
</div>
<app-notification-popup
  [visible]="notificationVisible"
  [title]="notificationTitle"
  [message]="notificationMessage"
  [success]="notificationSuccess"
  okButtonText="OK"
  (closed)="onNotificationClosed()">
</app-notification-popup>
<app-confirmation-popup
  [visible]="showSosConfirmPopup"
  title="Emergency SOS"
  message="Are you sure you want to activate SOS? Emergency services and support will be notified immediately."
  confirmButtonText="Activate SOS"
  cancelButtonText="Cancel"
  confirmButtonColor="red"
  (confirmed)="confirmSos()"
  (cancelled)="closeSosPopup()">
</app-confirmation-popup>
