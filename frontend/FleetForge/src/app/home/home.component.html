<div class="home-container">
  <div class="hero-section">
    <div class="hero-content">
      <h1>Book Rides<br>Anywhere</h1>
      <div class="hero-buttons">
        <button class="btn btn-primary" routerLink="/book">Book Now</button>
        <button class="btn btn-secondary">Call Operator</button>
      </div>
    </div>
    <div class="hero-image">
      <img src="home-screen.png" alt="Taxi and passengers" />
    </div>
  </div>

  <div class="find-vehicle-section">
    <div class="find-vehicle-container">
      <div class="form-section">
        <h2>Find Your Vehicle</h2>

        <!-- Dynamic Location Fields -->
        <div *ngFor="let field of locationFields; let i = index" class="form-group">
          
          <!-- Label -->
          <label [for]="field.id">
            <span *ngIf="field.type === 'pickup'">Pick Up Address</span>
            <span *ngIf="field.type === 'waypoint'">Waypoint {{ waypoints.indexOf(field) + 1 }}</span>
            <span *ngIf="field.type === 'dropoff'">Drop Off Address</span>
          </label>

          <!-- Input with optional remove button for waypoints -->
          <div class="input-wrapper" [class.has-remove-btn]="field.type === 'waypoint'">
            <input
              [id]="field.id"
              type="text"
              [placeholder]="field.type === 'pickup' ? 'Pick Destination' : 
                            field.type === 'dropoff' ? 'Pick Destination' : 
                            'New Waypoint'"
              [(ngModel)]="field.query"
              (input)="onLocationInput(field)"
              autocomplete="off"
            />
            <button 
              *ngIf="field.type === 'waypoint'" 
              class="btn-remove-waypoint" 
              type="button"
              (click)="removeWaypoint(field.id)"
              aria-label="Remove waypoint"
            >
              ✕
            </button>
          </div>

          <!-- Suggestions dropdown -->
          <ul class="suggestions" *ngIf="field.showSuggestions && field.suggestions.length">
            <li *ngFor="let suggestion of field.suggestions" (click)="selectSuggestion(field, suggestion)">
              {{ formatSuggestion(suggestion) }}
            </li>
          </ul>
        </div>

        <!-- Add Waypoint Button -->
        <div class="form-group">
          <button class="btn-add-waypoint" type="button" (click)="addWaypoint()">
            + Add Waypoint
          </button>
        </div>

        <div class="button-group">
          <button class="btn btn-estimate" (click)="estimateRide()">Estimate</button>
          <button class="btn btn-order" (click)="orderRide()">Order</button>
        </div>
      </div>
      <div class="map-section">
        <app-map
          [vehicles]="vehicles"
          (routeSummary)="onRouteSummary($event)">
        </app-map>
        <div *ngIf="estimatedDistance" class="estimate-result">
        <p>Distance: {{ estimatedDistance }} km</p>
        <p>Duration: {{ estimatedDuration }} min</p>
        <p>Cost: {{ estimatedCost }} RSD</p>
      </div>
      </div>      
    </div>
  </div>
</div>
