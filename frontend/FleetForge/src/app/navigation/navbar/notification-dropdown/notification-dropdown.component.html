<div class="notification-container">
  <button 
    type="button" 
    class="notification-bell" 
    (click)="toggleDropdown()"
    aria-label="Notifications"
  >
    <span class="bell-icon">🔔</span>
    <span class="notification-badge" *ngIf="unreadCount > 0">
      {{ unreadCount > 99 ? '99+' : unreadCount }}
    </span>
  </button>

  <div class="notification-dropdown" *ngIf="isOpen">
    <div class="notification-header">
      <h3>Notifications</h3>
      <button 
        type="button" 
        class="mark-all-read-btn" 
        *ngIf="unreadCount > 0"
        (click)="markAllAsRead()"
      >
        Mark all read
      </button>
    </div>

    <div class="notification-list">
      <div 
        *ngIf="notifications.length === 0" 
        class="no-notifications"
      >
        <span class="empty-icon">📭</span>
        <p>No notifications yet</p>
      </div>

      <div 
        *ngFor="let notification of notifications" 
        class="notification-item"
        [class.unread]="!notification.isRead"
        (click)="onNotificationClick(notification)"
      >
        <div class="notification-icon">
          {{ getNotificationIcon(notification.type) }}
        </div>
        <div class="notification-content">
          <p class="notification-message">{{ notification.message }}</p>
          <span class="notification-time">{{ getTimeAgo(notification.createdAt) }}</span>
        </div>
        <div class="unread-indicator" *ngIf="!notification.isRead"></div>
      </div>
    </div>

    <div class="notification-footer" *ngIf="notifications.length > 0">
      <button type="button" class="view-all-btn" (click)="closeDropdown()">
        View all notifications
      </button>
    </div>
  </div>
</div>
